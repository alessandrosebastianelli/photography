title: "Photography by Alessandro Sebastianelli"
description: "An Italian engineer's journal of photographs, travels, and the quiet art of seeing."
author: "Alessandro Sebastianelli"
email: ""
baseurl: "/photography"   # change to "" if deploying at root
url: "https://alessandrosebastianelli.github.io"

# Social
instagram: ""
github: "alessandrosebastianelli"
linkedin: "alessandrosebastianelli"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
