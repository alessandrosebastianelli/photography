title: "Photography by Alessandro Sebastianelli"
description: "An Italian engineer's journal of photographs, travels, and the quiet art of seeing."
author: "Alessandro Sebastianelli"
email: ""
baseurl: "/photography"   # change to "" if deploying at root domain
url: "https://alessandrosebastianelli.github.io"

# Social handles
instagram: "a.sebastianelli_photographer"
#github: "alessandrosebastianelli"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Pages collection (fixes 404 on inner pages)
collections:
  pages:
    output: true
    permalink: /:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Language defaults — all posts/pages are English unless overridden
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      lang: en
