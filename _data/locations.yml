#   name        – Display name of the place
#   lat/lng     – Coordinates for the map marker
#   country     – Used for grouping/filtering
#   cover       – Path to a representative image (relative to site root)
#   posts       – List of blog post slugs linked to this place
#   gallery_tag – Tag used to filter the gallery for this location

