  about_contact: "Contatti"
  about_contact_text: "Domande, collaborazioni, o vuoi solo parlare di fotografia? Scrivimi su"
  about_p1: "Sono un ingegnere italiano con l'irresistibile abitudine di portare una fotocamera ovunque. La fotografia è arrivata come un modo per rallentare — una disciplina che ti obbliga a guardare davvero il mondo, invece di attraversarlo soltanto."
  about_p2: "Questo blog è il punto d'incontro tra l'ossessione tecnica e il bisogno di viaggiare. Scrivo dei luoghi visitati, delle tecniche imparate (e disimparate), e della realtà onesta — a volte poco glamour — di fare fotografie di cui essere fieri."
  about_p3: "Ogni foto qui è un posto dove mi sono fermato, una luce che ho aspettato, un momento che ho quasi mancato. Le immagini su questo sito sono in bassa risoluzione per una navigazione più fluida — gli originali sono stampati e appesi ai muri."
