  about_contact: "Get in touch"
  about_contact_text: "Questions, collaborations, or just want to talk cameras? Reach me on"
  about_p1: "I'm an engineer from Italy with an incurable habit of carrying a camera everywhere. Photography came to me as a way to slow down — a discipline that forces you to really look at the world rather than just move through it."
  about_p2: "This blog is where technical obsession meets the urge to wander. I write about the places I've visited, the techniques I've learned (and unlearned), and the honest, sometimes unglamorous reality of making photographs you can be proud of."
  about_p3: "Every photo here is a place I stood, a light I waited for, a moment I almost didn't catch. The images on this site are in reduced resolution to keep navigation smooth — but the originals are printed and hanging on walls."
